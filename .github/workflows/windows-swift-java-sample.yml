name: Windows swift-java JNI sample gate

on:
  push:
    branches:
      - codex/windows-dll-support
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-jni-sample-standard:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Check out swift-java at the investigated commit
        uses: actions/checkout@v4
        with:
          repository: swiftlang/swift-java
          ref: 4cf5605a03219fc7c99149020b0923c0a73a4f3c
          path: swift-java

      - name: Set up Swift 6.2.1
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.2.1"

      - name: Set up Corretto JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "25"

      - name: Record environment and build artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          swift --version | Tee-Object -FilePath evidence/environment.txt
          java --version 2>&1 | Tee-Object -FilePath evidence/environment.txt -Append
          "JAVA_HOME=$env:JAVA_HOME" | Tee-Object -FilePath evidence/environment.txt -Append
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture |
            Format-List |
            Out-String |
            Tee-Object -FilePath evidence/environment.txt -Append

          Push-Location swift-java/Samples/SwiftJavaExtractJNISampleApp
          swift build --disable-sandbox --disable-experimental-prebuilts 2>&1 |
            Tee-Object -FilePath ../../../evidence/swift-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $binPath = swift build --show-bin-path
          "binPath=$binPath" | Tee-Object -FilePath ../../../evidence/artifacts.txt
          Get-ChildItem $binPath -Filter *.dll |
            Select-Object Name, Length, FullName |
            Format-Table -AutoSize |
            Out-String |
            Tee-Object -FilePath ../../../evidence/artifacts.txt -Append

          $targetInfo = swiftc -print-target-info | ConvertFrom-Json
          "runtimeLibraryPaths:" | Tee-Object -FilePath ../../../evidence/artifacts.txt -Append
          $targetInfo.paths.runtimeLibraryPaths |
            Tee-Object -FilePath ../../../evidence/artifacts.txt -Append

          $readobj = Get-Command llvm-readobj -ErrorAction Stop
          "llvm-readobj=$($readobj.Source)" |
            Tee-Object -FilePath ../../../evidence/artifacts.txt -Append
          Get-ChildItem $binPath -Filter *.dll | ForEach-Object {
            "===== $($_.Name) =====" |
              Tee-Object -FilePath ../../../evidence/coff-imports.txt -Append
            & $readobj.Source --coff-imports $_.FullName 2>&1 |
              Tee-Object -FilePath ../../../evidence/coff-imports.txt -Append
          }
          Pop-Location

      - name: Run official JNI sample with its standard Gradle configuration
        id: standard
        continue-on-error: true
        shell: pwsh
        run: |
          Push-Location swift-java
          .\gradlew.bat :Samples:SwiftJavaExtractJNISampleApp:run --stacktrace --no-daemon 2>&1 |
            Tee-Object -FilePath ../evidence/official-sample-standard.txt
          $code = $LASTEXITCODE
          Pop-Location
          exit $code

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-jni-sample-standard
          path: evidence
          if-no-files-found: error

      - name: Enforce standard-sample gate
        if: steps.standard.outcome != 'success'
        shell: pwsh
        run: |
          throw "The official SwiftJavaExtractJNISampleApp failed in its standard configuration. Do not proceed to Minecraft-specific loader work."
