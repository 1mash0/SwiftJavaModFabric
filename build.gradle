import java.util.Locale

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

def swiftTargetName = "SwiftJavaModFabric"

def generatedJavaDir = layout.projectDirectory.dir(
    ".build/plugins/outputs/" +
    "${projectDir.name.toLowerCase(Locale.ROOT)}/" +
    "${swiftTargetName}/" +
    "destination/JExtractSwiftPlugin/src/generated/java"
)

def jextract = tasks.register("jextract", Exec) {
    description = "Build the Swift package and generate Java wrappers"

    workingDir projectDir
    commandLine "swift"

    args "build", "--disable-sandbox", "--disable-experimental-prebuilts"

    inputs.file file("Package.swift")
    inputs.dir file("Sources/${swiftTargetName}")

    outputs.dir generatedJavaDir
}

def swiftJavaClasspathFile = file(
    "Sources/MinecraftJavaAPI/MinecraftJavaAPI.swift-java.classpath"
)

def writeSwiftJavaClasspath = tasks.register(
    "writeSwiftJavaClasspath"
) {
    group = "swift"
    description = "Write the Fabric compile classpath for SwiftJavaPlugin"

    inputs.files(sourceSets.main.compileClasspath)
    outputs.file(swiftJavaClasspathFile)

    doLast {
        swiftJavaClasspathFile.parentFile.mkdirs()

        swiftJavaClasspathFile.text =
            sourceSets.main.compileClasspath.files
                .collect { it.absolutePath }
                .join(File.pathSeparator)
    }
}

tasks.named("jextract") {
	dependsOn writeSwiftJavaClasspath
}


sourceSets {
    main {
        java {
            // 公式サンプルと同じく、タスク出力とタスク依存を接続する
            srcDir jextract

            // IDEやGradleインポート時にも生成ソース位置を認識させる
            srcDir generatedJavaDir
        }
    }
}

tasks.named("build") {
	dependsOn jextract
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	mavenLocal()
}

def swiftLibraryDir = file(".build/out/Products/Debug").absolutePath

loom {
	splitEnvironmentSourceSets()

	mods {
		"SwiftJavaModFabric" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			vmArgs "-Djava.library.path=${swiftLibraryDir}"
			// ライブラリ読み込みの詳細を出す。動作確認後は削除可能
            vmArgs "-Djextract.trace.downcalls=true"
        }

        server {
            vmArgs "-Djava.library.path=${swiftLibraryDir}"
            vmArgs "-Djextract.trace.downcalls=true"
        }
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "org.swift.swiftkit:swiftkit-core:1.0-SNAPSHOT"
    implementation "org.swift.swiftkit:swiftkit-ffm:1.0-SNAPSHOT"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.named("sourcesJar") {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
